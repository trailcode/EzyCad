# Lightweight checks that do not require OpenCASCADE or a full native build.
name: Source hygiene

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  ascii-src:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: ASCII in src/ and tests/
        run: python scripts/agent_check.py
